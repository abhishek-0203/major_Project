# docker-compose.yml
version: '3.8'
services:
  db:
    image: postgres:15-alpine # Use a recent version of Postgres
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    ports:
      - '5432:5432' # Expose Postgres port to your local machine
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: